name: Integración Continua - Backend RoomieSmart

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    name: Revisión de Código
    runs-on: ubuntu-latest
    
    # Esto asegura que busque el package.json dentro de la carpeta correcta
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Instalar dependencias
      run: npm install